<div class="game-layout">
  <!-- Top Bar / Header HUD -->
  <header class="top-bar">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1 class="logo-text">GEO<span class="highlight">MEM</span></h1>
    </div>

    <div class="mode-pill">
      <span class="mode-label">Mode:</span>
      <span class="mode-name">Countries</span>
    </div>

    <div class="user-action">
      <button class="icon-btn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Center Stage: The Globe Canvas will mount here in Phase 2 -->
  <main class="globe-viewport">
    <div class="placeholder-globe">
      <div class="globe-preview-sphere"></div>
      <p class="placeholder-hint">Phase 2: 3D Globe will render here</p>
    </div>
  </main>

  <!-- Bottom Target Prompt HUD -->
  <footer class="bottom-hud">
    <div class="target-card">
      <span class="target-type">Target Country</span>
      <h2 class="target-name">Madagascar</h2>
      <p class="instruction-text">
        <span class="hint-bullet">●</span> Press &amp; hold for 1s to drop pin
      </p>
    </div>
  </footer>
</div>
